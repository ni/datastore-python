name: Run unit tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: 'The version of Python to use'
        default: ''
        required: true
        type: string
      os:
        description: 'The name of the OS to use'
        required: true
        type: string

jobs:
  run_unit_tests:
    name: Run unit tests for ni.datastore with ${{ inputs.python-version }} on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    strategy:
      # Fail-fast skews the pass/fail ratio and seems to make pytest produce
      # incomplete JUnit XML results.
      fail-fast: false
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up Python
        uses: ni/python-actions/setup-python@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        id: setup-python
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
      - name: Run and upload unit tests for ni.datastore
        uses: ./.github/actions/run_and_upload_unit_tests