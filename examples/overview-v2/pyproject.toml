[project]
name = "overview_v2_example"
version = "1.0.0"
license = "MIT"
description = "Overview of how to use the NI Measurement Data Store V2 APIs for publishing and reading data"
maintainers = [
  {name = "Michael Johansen", email = "michael.johansen@emerson.com"},
  {name = "Joel Dixon", email = "joel.dixon@emerson.com"}
]
readme = "README.md"
repository = "https://github.com/ni/datastore-python"
keywords = ["overview", "example", "v2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["dependencies"]
requires-python = '>=3.11,<4.0'

[[tool.poetry.packages]]
include = "src"

[project.scripts]
overview-v2 = "src.overview:main"

[tool.poetry]
requires-poetry = '>=2.1,<3.0'

[tool.poetry.dependencies]
python = "^3.11"
# The V2 API is not released yet, so use the local ni-datastore code.
ni-datastore = {path = "../..", develop = true}
hightime = { version = ">=1.0.0" }

[tool.poetry.group.dev.dependencies]
types-grpcio = ">=1.0"
types-protobuf = ">=4.21"
# Uncomment to use local ni-datastore code
# ni-datastore = {path = "../..", develop = true}
datastore-utilities = { path = "../../utilities", develop = true }

[tool.poetry.group.lint.dependencies]
ni-python-styleguide = ">=0.4.1"
mypy = ">=1.0"

[build-system]
requires = ["poetry-core>=2.1.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.mypy]
mypy_path = "src"
files = "."
namespace_packages = true
strict = true
explicit_package_bases = true
exclude = ["docs"]
